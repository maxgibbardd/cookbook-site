<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Max's Cookbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,50,1;1,9..144,400..900,50,1&family=Nunito:ital,wght@0,400..800;1,400..700&family=DM+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
/* Layout: a kitchen counter. Checker-tile header band, recipe cards pinned like index cards,
   one sticky ingredient card beside the steps. Tomato accent, basil + butter supporting. */
:root{
  --ground:#F3F6EA; --surface:#FFFFFF; --surface-2:#FBF4E3;
  --ink:#232A1E; --muted:#5F6B55; --rule:#DCE3CC;
  --accent:#D1442A; --accent-ink:#FFFFFF; --accent-soft:#FBE3DC;
  --basil:#3B8A52; --basil-soft:#E1F0E2;
  --butter:#F3C044; --butter-ink:#3A2A00; --butter-soft:#FCEFC6;
  --plum:#7D3F72;
  --tile-a:#D1442A; --tile-b:#C13A22; --on-tile:#FFF6EC;
  --danger:#B3261E; --danger-soft:#FBE4E2;
  --shadow:0 1px 2px rgba(35,42,30,.07),0 6px 18px rgba(35,42,30,.08);
  --f-display:"Fraunces",ui-rounded,Georgia,"Times New Roman",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#13160F; --surface:#1C2017; --surface-2:#232819;
    --ink:#EFEADA; --muted:#A3AF95; --rule:#333A28;
    --accent:#FF7B55; --accent-ink:#1B0C06; --accent-soft:#3A1E15;
    --basil:#79C78C; --basil-soft:#1D2E21;
    --butter:#E9BB42; --butter-ink:#241900; --butter-soft:#382D0F;
    --plum:#CE91C3;
    --tile-a:#8E2D1A; --tile-b:#7A2415; --on-tile:#FFF1E4;
    --danger:#F28B82; --danger-soft:#3B1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#13160F; --surface:#1C2017; --surface-2:#232819;
  --ink:#EFEADA; --muted:#A3AF95; --rule:#333A28;
  --accent:#FF7B55; --accent-ink:#1B0C06; --accent-soft:#3A1E15;
  --basil:#79C78C; --basil-soft:#1D2E21;
  --butter:#E9BB42; --butter-ink:#241900; --butter-soft:#382D0F;
  --plum:#CE91C3;
  --tile-a:#8E2D1A; --tile-b:#7A2415; --on-tile:#FFF1E4;
  --danger:#F28B82; --danger-soft:#3B1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Checker-tile header */
.rim{
  background-color:var(--tile-a);
  background-image:
    linear-gradient(45deg,var(--tile-b) 25%,transparent 25% 75%,var(--tile-b) 75%),
    linear-gradient(45deg,var(--tile-b) 25%,transparent 25% 75%,var(--tile-b) 75%);
  background-size:52px 52px;
  background-position:0 0,26px 26px;
  border-bottom:6px dashed var(--butter);
  color:var(--on-tile);
}
.rim .wrap{padding-block:26px 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{all:unset;cursor:pointer;display:block}
.brand:focus-visible{outline:3px solid var(--on-tile);outline-offset:4px}
.brand-kicker{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.brand-name{display:block;font-family:var(--f-display);font-variation-settings:"SOFT" 60,"WONK" 1;font-weight:800;font-size:clamp(40px,7.4vw,70px);line-height:.92;letter-spacing:-.02em;margin-top:4px;text-shadow:3px 3px 0 rgba(0,0,0,.18)}
.brand:hover .brand-name{transform:rotate(-1.2deg)}
.brand-name{transition:transform .18s ease}
.rim-note{margin:0;max-width:34ch;font-size:15.5px;opacity:.95}
.rim-note .pan{display:inline-block;font-size:20px;animation:sizzle 2.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes sizzle{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}95%{transform:rotate(7deg)}}

main{padding-block:28px 96px}
.notice{background:var(--surface);border:2px dashed var(--rule);border-radius:14px;padding:16px 18px;color:var(--muted);margin-bottom:24px}
.notice strong{color:var(--ink)}

/* Section heads */
.section + .section{margin-top:44px}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-h{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
.section-top .section-h{margin:0}
.count{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--muted)}
.eyebrow{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:15px;cursor:pointer;line-height:1.2;transition:transform .14s ease,border-color .14s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sprout{background:var(--basil-soft);border-color:var(--basil);color:var(--ink)}
.btn.sprout:hover{transform:translateY(-1px) rotate(-1.5deg)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger.solid{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.linkish:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px}
#search{flex:1 1 260px;min-width:0;background:var(--surface);border:2px solid var(--rule);border-radius:999px;padding:9px 16px;font-size:16px}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted);transition:transform .14s ease}
.chip:hover{transform:translateY(-1px) rotate(-1.5deg);color:var(--ink)}
.chip.on{background:var(--basil);border-color:var(--basil);color:#fff}

/* Recipe cards, pinned like index cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--rule);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s;position:relative;min-width:0}
.card:nth-child(3n+2){transform:rotate(.5deg)}
.card:nth-child(3n){transform:rotate(-.6deg)}
.card:hover{border-color:var(--accent);transform:translateY(-3px) rotate(-1deg)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card-badge{position:absolute;top:-14px;right:14px;width:40px;height:40px;display:grid;place-items:center;font-size:21px;background:var(--butter-soft);border:2px solid var(--butter);border-radius:50%;line-height:1}
.card-title{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:700;font-size:22px;line-height:1.18;letter-spacing:-.01em;text-wrap:balance;padding-right:34px}
.card-desc{color:var(--muted);font-size:15px;line-height:1.45}
.card-meta{margin-top:auto;padding-top:10px;border-top:2px dotted var(--rule);font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:28px 0}

.plan-card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;background:var(--butter-soft);border:2px solid var(--butter);border-radius:18px;padding:16px 20px;transition:transform .16s ease}
.plan-card:hover{transform:translateY(-2px) rotate(-.7deg)}
.plan-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.plan-clock{grid-row:span 2;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--butter);color:var(--butter-ink);border-radius:12px;padding:10px;text-align:center;line-height:1.2;min-width:70px}
.plan-clock b{display:block;font-size:20px}
.plan-title{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:700;font-size:21px;line-height:1.2}
.plan-sub{color:var(--muted);font-size:14.5px}
.plan-list{display:grid;gap:12px}

/* Recipe page */
.crumb{margin-bottom:18px}
.r-head{max-width:760px}
.r-title{font-family:var(--f-display);font-variation-settings:"SOFT" 60,"WONK" 1;font-weight:800;font-size:clamp(34px,5.6vw,54px);line-height:1.02;letter-spacing:-.025em;margin:8px 0 12px;text-wrap:balance}
.r-title .emoji{font-size:.78em;margin-right:.18em}
.r-desc{color:var(--muted);font-size:18px;margin:0;max-width:62ch}
.metabar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:22px 0 28px;padding:12px 0;border-block:2px dotted var(--rule)}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--rule);border-radius:999px;background:var(--surface);overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--accent)}
.stepper button:hover{background:var(--accent-soft)}
.stepper button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.stepper output{font-family:var(--f-mono);font-weight:500;font-size:14px;min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
.meta-pill{font-family:var(--f-mono);font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.spacer{flex:1}
.btn[aria-pressed="true"]{background:var(--butter);border-color:var(--butter);color:var(--butter-ink)}

.r-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:780px){.r-grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.ing-box{background:var(--surface);border:2px solid var(--rule);border-radius:18px;padding:18px 18px 12px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
@media (max-width:780px){.ing-box{position:static}}
.box-h{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:700;font-size:21px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box-h .linkish{font-size:13px;font-family:var(--f-body)}
.ing-group{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:14px 0 4px}
.ing-list{list-style:none;margin:0;padding:0}
.ing{border-top:1px dotted var(--rule)}
.ing:first-child{border-top:0}
.ing label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;cursor:pointer;font-size:16px;line-height:1.35}
.ing input{appearance:none;width:22px;height:22px;border:2px solid var(--rule);border-radius:8px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.ing input:hover{border-color:var(--basil)}
.ing input:checked{background:var(--basil);border-color:var(--basil);animation:pop .28s ease}
.ing input:checked::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 3px 3px;transform:translateY(-1px) rotate(-45deg)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32) rotate(-8deg)}100%{transform:scale(1)}}
.amt{font-family:var(--f-mono);font-weight:500;font-size:14.5px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:6px;white-space:nowrap}
.ing.done .ing-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--basil);text-decoration-thickness:2px}
.ing.done .amt{color:var(--muted)}

/* Basket progress */
.basket{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.basket-bar{flex:1;height:9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden;min-width:0}
.basket-bar i{display:block;height:100%;background:var(--basil);transition:width .3s ease}
.basket.full{color:var(--basil);font-weight:500}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px dotted var(--rule)}
.step:first-child{border-top:0;padding-top:0}
.step-n{all:unset;cursor:pointer;font-family:var(--f-display);font-variation-settings:"SOFT" 60,"WONK" 1;font-weight:800;font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;transition:transform .16s ease}
.step-n:hover{transform:scale(1.08) rotate(-6deg)}
.step-n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.step.done .step-n{background:var(--basil);color:#fff;animation:pop .28s ease}
.step.done .step-t,.step.done .step-body{color:var(--muted)}
.step.done .step-t{text-decoration:line-through;text-decoration-color:var(--basil);text-decoration-thickness:2px}
.step-t{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:700;font-size:20px;line-height:1.25;margin:6px 0 4px}
.step p{margin:0;max-width:62ch}
.timer{margin-top:10px;display:inline-flex;align-items:center;gap:7px;border:2px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 13px 5px 10px;font-family:var(--f-mono);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.timer:hover{border-color:var(--accent)}
.timer svg{width:15px;height:15px;flex:none}
.timer.running{background:var(--butter);border-color:var(--butter);color:var(--butter-ink)}
.timer.done{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

.notes{margin-top:36px;background:var(--surface-2);border:2px dashed var(--rule);border-radius:18px;padding:16px 20px}
.notes h2{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-size:19px;margin:0 0 6px}
.notes p{margin:0;white-space:pre-line;max-width:70ch}

/* Plan page */
.plan-recipes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.timeline{list-style:none;margin:0;padding:0;max-width:760px}
.tl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;position:relative;padding-bottom:22px}
.tl::before{content:"";position:absolute;left:35px;top:36px;bottom:0;width:3px;background:var(--rule)}
.tl:last-child::before{display:none}
.tl-at{font-family:var(--f-mono);font-weight:500;font-size:14px;text-align:center;background:var(--surface);border:2px solid var(--rule);border-radius:999px;padding:5px 0;height:max-content;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.tl-body h3{font-family:var(--f-display);font-variation-settings:"SOFT" 50,"WONK" 1;font-weight:700;font-size:19px;margin:3px 0 4px;line-height:1.25}
.tl-body ul{margin:0;padding-left:18px}
.tl-body li{margin:3px 0}
.tl-body li::marker{color:var(--accent)}

/* Edit form */
.form{max-width:760px;display:grid;gap:18px}
.form h1{font-family:var(--f-display);font-variation-settings:"SOFT" 60,"WONK" 1;font-weight:800;font-size:clamp(30px,4.6vw,42px);letter-spacing:-.02em;margin:4px 0 0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:800;font-size:15px}
.field input,.field textarea{width:100%;background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;line-height:1.5}
.field textarea.mono{font-family:var(--f-mono);font-size:14px}
.hint{font-size:13.5px;color:var(--muted);line-height:1.45}
.hint code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:0 4px}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:6px}
.form-err{color:var(--danger);background:var(--danger-soft);border-radius:12px;padding:10px 14px;font-weight:700}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--danger);font-weight:700}

/* Timer tray */
.tray{position:fixed;right:0;bottom:0;padding:16px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;max-width:100%}
.tray-item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--ground);border-radius:14px;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.tray-item b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--butter)}
.tray-item.done{background:var(--danger);color:#fff}
.tray-item.done b{color:#fff}
.tray-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}

.foot{margin-top:56px;padding-top:16px;border-top:2px dotted var(--rule);color:var(--muted);font-size:14px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="rim">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Max's Cookbook, all recipes">
      <span class="brand-kicker">Recipe box</span>
      <span class="brand-name">Max's Cookbook</span>
    </button>
    <p class="rim-note"><span class="pan" aria-hidden="true">🍳</span> Things I've cooked and want to make again, scaled to however many I'm feeding.</p>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite"></main>
<div class="tray" id="tray" hidden></div>

<script>

function frac(x){

  let best = { n: 0, d: 1, err: rem };

  if (best.n){ const g = gcd(best.n, best.d); best.n /= g; best.d /= g; }

async function onSave(ev){
  ev.preventDefault();
  const v = id => ($("#" + id)?.value || "").trim();
  const title = v("f-title");
  if (!title){ formError("Give the recipe a name."); $("#f-title").focus(); return; }
  const ingredients = parseIngredients(v("f-ings"));
  const steps = parseSteps(v("f-steps"));
  if (!ingredients.length && !steps.length){ formError("Add at least one ingredient or step."); return; }
  if (!db){ formError("Saving only works when the cookbook is open in Claude."); return; }
  const existing = S.editing ? recipes.find(x => x.id === S.editing) : null;
  const now = new Date().toISOString();
  const serv = Math.max(1, Math.min(60, parseInt(v("f-serv"), 10) || 4));
  const data = { title, category: v("f-cat"), description: v("f-desc"), baseServings: serv, time: v("f-time"),
    ingredients, steps, notes: v("f-notes"), createdAt: existing?.createdAt || now, updatedAt: now };
  const id = existing ? existing.id : slugify(title) + "-" + Math.random().toString(36).slice(2, 6);
  const btn = $("#f-save"); btn.disabled = true; btn.textContent = "Saving…"; formError("");
  try {
    await db.collection("recipes").doc(id).set(data);
    const i = recipes.findIndex(x => x.id === id);
    const rec = { id, ...data };
    if (i >= 0) recipes[i] = rec; else recipes.push(rec);
    if (existing && S.servings[id] != null && existing.baseServings !== serv) delete S.servings[id];
    go("recipe", id);
  } catch (e){
    btn.disabled = false; btn.textContent = existing ? "Save changes" : "Add to cookbook";
    formError(writeError(e));
    if (e && e.code === "invalid_argument") S.canEdit = false;
  }
}

/* ---------- timers ---------- */
function timerBtn(r, i, s){
  const key = r.id + "-" + i;
  return h("button", { class: "timer", type: "button", "data-timer": key, "aria-label": "Timer for " + (s.title || "step " + (i + 1)),
    onclick: () => toggleTimer(key, s.minutes, (r.title || "") + ": " + (s.title || "Step " + (i + 1)), r.id) },
    svgClock(), h("span", { class: "tl-label" }, fmtMin(s.minutes)));
}
function toggleTimer(key, minutes, label, recipeId){
  if (S.timers[key]){ delete S.timers[key]; }
  else {
    try { S.ac = S.ac || new (window.AudioContext || window.webkitAudioContext)(); S.ac.resume && S.ac.resume(); } catch {}
    S.timers[key] = { end: Date.now() + minutes * 60000, minutes, label, recipeId, done: false };
  }
  if (!S.tick && Object.keys(S.timers).length) S.tick = setInterval(tickTimers, 1000);
  tickTimers();
}
function beep(){
  const ac = S.ac; if (!ac) return;
  try {
    const t0 = ac.currentTime;
    for (let k = 0; k < 3; k++){
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + k * 0.45);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + k * 0.45 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + k * 0.45 + 0.3);
      o.connect(g).connect(ac.destination); o.start(t0 + k * 0.45); o.stop(t0 + k * 0.45 + 0.32);
    }
  } catch {}
}
function tickTimers(){
  const now = Date.now();
  document.querySelectorAll("[data-timer]").forEach(el => {
    const t = S.timers[el.dataset.timer];
    el.classList.toggle("running", !!t && !t.done);
    el.classList.toggle("done", !!t && t.done);
    const lab = el.querySelector(".tl-label");
    if (!t){
      const step = recipes.find(r => el.dataset.timer.startsWith(r.id + "-"));
      const idx = step ? +el.dataset.timer.slice(step.id.length + 1) : -1;
      const m = step?.steps?.[idx]?.minutes; if (m) lab.textContent = fmtMin(m);
    }
  });
  const tray = $("#tray"); const items = [];
  for (const [key, t] of Object.entries(S.timers)){
    const left = Math.max(0, Math.round((t.end - now) / 1000));
    if (left === 0 && !t.done){ t.done = true; beep(); }
    const el = document.querySelector('[data-timer="' + key + '"]');
    if (el){ el.classList.toggle("running", !t.done); el.classList.toggle("done", t.done); el.querySelector(".tl-label").textContent = t.done ? "Time's up" : fmtClock(left) + " left"; }
    items.push(h("button", { class: "tray-item" + (t.done ? " done" : ""), type: "button", title: "Open recipe",
      onclick: () => { if (t.done) { delete S.timers[key]; tickTimers(); } if (S.view !== "recipe" || S.id !== t.recipeId) go("recipe", t.recipeId); } },
      h("b", null, t.done ? "Done" : fmtClock(left)), h("span", null, t.label)));
  }
  tray.replaceChildren(...items); tray.hidden = !items.length;
  if (!items.length && S.tick){ clearInterval(S.tick); S.tick = null; }
}

async function toggleWake(){

    if (S.wake){ await S.wake.release(); S.wake = null; }
    else {

      S.wake.addEventListener("release", () => { S.wake = null; updateWake(); });
    }
  } catch { S.wake = null; S.wakeFailed = true; }
  updateWake();
}
function updateWake(){

}

/* ---------- render ---------- */
function render(){
  const main = $("#main");
  if (S.view === "edit" && main.dataset.view === "edit") return; // don't wipe a form in progress
  const a = document.activeElement, keepSearch = a && a.id === "search", pos = keepSearch ? a.selectionStart : null;
  const v = S.view === "recipe" ? viewRecipe() : S.view === "plan" ? viewPlan() : S.view === "edit" ? viewEdit() : viewHome();
  main.replaceChildren(v);
  main.dataset.view = S.view;
  if (keepSearch){ const s = $("#search"); if (s){ s.focus(); try { s.setSelectionRange(pos, pos); } catch {} } }
  tickTimers();
}
function tryHash(){
  if (!S.hash || !S.loadedR || !S.loadedP) return;
  const t = S.hash; S.hash = "";
  if (recipes.some(r => r.id === t)) go("recipe", t);
  else if (plans.some(p => p.id === t)) go("plan", t);

(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db){
    recipes = SEED_RECIPES.slice(); plans = SEED_PLANS.slice();
    S.status = "static"; S.loadedR = true; S.loadedP = true; render(); tryHash(); return;
  }
  S.status = "ok";
  const fail = () => { S.status = "error"; S.loadedR = true; render(); };
  db.collection("recipes").onSnapshot(snap => {
    recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loadedR = true; render(); tryHash();
  }, fail);
  db.collection("plans").onSnapshot(snap => {
    plans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loadedP = true; render(); tryHash();
  }, () => { S.loadedP = true; render(); });
  render();
})();
(async () => {
  try {
    const u = await window.claude?.use?.("user");
    S.canEdit = u ? await u.canEdit() : null;
  } catch { S.canEdit = null; }
  render();
})();
})();
</script>
